name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs (pink on dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#b07890&color_dots=#f3eef0,#f6d3e1,#f1bfd3,#d891b2,#b07890
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f1bfd3&color_dots=#161115,#3a2430,#6b4256,#b07890,#f1bfd3

      - name: Publish them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
